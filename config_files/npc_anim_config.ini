; 格式：原按键动作ID_当前动作ID = 新动作ID
; 当按下原按键动作ID瞬间，如果处于当前动作ID，则下一个动作派生新动作ID
; 可以将多个新动作ID用_连接，简化同一按键的连招写法，当处于前一个新动作ID时，触发后一个新动作ID
; 原按键动作ID指的是NpcParam中设置的动作，默认是700-703，3000-3007
; 当前动作ID和新动作ID可以是NPC任意有效的动作，可以用开发者菜单查看
; 可以不写当前动作ID，直接将原按键动作ID映射成新动作ID

; 控制npc时，会根据npc的CharacterId(默认为npc param id)加载[CharacterId]下的配置
; 可以用_连接多个CharacterId，表示多个CharacterId使用同一套配置
; 如果没有匹配的[CharacterId]，则使用下面的默认配置

; 默认配置
; 弹反
3000 = 3101

; 垫步闪避
701 = 5201

; 连招
3001 = 3000_3001_3002


[71101000]
; 不死斩巴流弦一郎
; 弹反
3000 = 3101_3100

; 弹刀时反斩
3001_8400 = 3037_3006_3055
3001_8401 = 3031_3035_3055

; 被格挡时追斩
3001_8700 = 3050
3001_8701 = 3055

; 垫步闪避
701 = 5201
701_405002 = 5202
701_405003 = 5203

; 连招
3001 = 3000_3001_3055
3002 = 3016
3001_3016 = 3030_3010_3045
3001_3003 = 3045_3085_3086
3007 = 3021
3001_3021 = 3008
3006 = 3014_3019_3029
3001_3014 = 3035_3055
700 = 3034
3001_3034 = 3035
3006_3034 = 3019
702 = 3028

