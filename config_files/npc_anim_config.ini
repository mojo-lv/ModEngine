; 格式：原按键动作ID_当前动作ID = 新动作ID
; 当按下原按键动作ID瞬间，如果处于当前动作ID，则下一个动作派生新动作ID
; 可以将多个新动作ID用_连接，简化同一按键的连招写法，当处于前一个新动作ID时，触发后一个新动作ID
; 原按键动作ID指的是NpcParam中设置的动作，默认是700-703，3000-3007
; 当前动作ID和新动作ID可以是NPC任意有效的动作，可以用开发者菜单查看
; 可以不写当前动作ID，直接将原按键动作ID映射成新动作ID
; 在后面的配置会覆盖前面的配置，
; 比如3001 = 3000_3001，后面再写3001_3000 = 3002，
; 则当按下3001时，如果npc处于3000动作，触发3002动作
; 可以开启[logs]下的npc_anim_change来查看动作ID变换信息

; 控制npc时，会根据npc的CharacterId(默认为npc param id)加载[CharacterId]下的配置
; 如果没有匹配的[CharacterId]，则使用下面的默认配置
; CharacterId后面可以加_连接一个动作ID，表示npc执行这个动作时，追加覆盖之前的配置

; 默认配置
; 弹反
3000 = 3101

; 垫步闪避
701 = 5201

; 连招
3001 = 3000_3001_3002


